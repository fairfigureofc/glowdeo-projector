name: Android APK
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Lint, unit tests and APK build
        run: ./gradlew ktlintCheck detekt lintDebug testDebugUnitTest assembleDebug assembleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: glowdeo-build-reports
          path: app/build/reports/
      - uses: actions/upload-artifact@v4
        with:
          name: glowdeo-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: glowdeo-release-unsigned
          path: app/build/outputs/apk/release/*.apk
  device:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: Nexus 6
          script: |
            ./gradlew connectedDebugAndroidTest
            adb shell am start -n com.glowdeo.player.debug/com.glowdeo.player.MainActivity
            sleep 3
            adb shell input keyevent 4
            sleep 2
            adb shell screencap -p /sdcard/glowdeo-demo.png
            adb pull /sdcard/glowdeo-demo.png .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: glowdeo-device-check
          path: |
            glowdeo-demo.png
            app/build/reports/androidTests/
