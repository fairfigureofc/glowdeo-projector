name: Android APK
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Lint, unit tests and APK build
        run: ./gradlew ktlintCheck detekt lintDebug testDebugUnitTest assembleDebug assembleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: glowdeo-build-reports
          path: app/build/reports/
      - uses: actions/upload-artifact@v4
        with:
          name: glowdeo-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: glowdeo-release-unsigned
          path: app/build/outputs/apk/release/*.apk
  device:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: Nexus 4
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -memory 2048 -cores 2
          script: |
            adb shell settings put secure immersive_mode_confirmations confirmed
            adb shell wm size 720x1280
            adb shell wm density 240
            adb shell input keyevent 82
            ./gradlew connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.timeout_msec=180000 || (adb shell screencap -p /sdcard/glowdeo-failure.png; adb pull /sdcard/glowdeo-failure.png .; adb logcat -d > glowdeo-device.log; exit 1)
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n com.glowdeo.player.debug/com.glowdeo.player.MainActivity
            sleep 3
            adb shell input keyevent 4
            sleep 2
            adb shell screencap -p /sdcard/glowdeo-demo.png
            adb pull /sdcard/glowdeo-demo.png .
            adb pull /sdcard/glowdeo-camera-controls.png .
            adb pull /sdcard/glowdeo-photo-mapping.png .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: glowdeo-device-check
          path: |
            glowdeo-demo.png
            glowdeo-camera-controls.png
            glowdeo-photo-mapping.png
            glowdeo-failure.png
            glowdeo-device.log
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
