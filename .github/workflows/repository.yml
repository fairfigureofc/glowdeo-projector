name: Repository checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check conventional commit headers
        run: python3 scripts/check_commit.py --history
      - name: Test commit policy
        run: python3 -m unittest discover -s tests -v
      - name: Check reference Python syntax
        run: python3 -m py_compile prototype/companion/server.py
